<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Remote Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #131313;
    --panel-2: #191919;
    --border: #262626;
    --text: #d9d9d6;
    --text-dim: #6d6d6a;
    --accent: #ffb000;
    --accent-dim: #6b4b00;
    --ok: #5fd75f;
    --err: #ff5f56;
    --font: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }

  #console {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 0 rgba(255,176,0,0.06); flex-wrap: wrap;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #console.hidden { opacity: 0; transform: translateY(-100%); pointer-events: none; }

  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); }
  .field input, .field select {
    font-family: var(--font); font-size: 12.5px; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 3px;
    padding: 6px 8px; outline: none; transition: border-color 0.15s ease;
  }
  .field input:focus, .field select:focus { border-color: var(--accent-dim); }

  #url { width: 180px; }
  #room { width: 80px; }
  #token { width: 110px; }
  #savedConns { width: 130px; }

  select {
    appearance: none; -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%236d6d6a'/></svg>");
    background-repeat: no-repeat; background-position: right 8px center; padding-right: 22px;
  }

  button {
    font-family: var(--font); font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
    border: 1px solid transparent; border-radius: 3px; padding: 8px 12px; cursor: pointer;
    transition: filter 0.12s ease, transform 0.05s ease; white-space: nowrap;
  }
  button:active { transform: translateY(1px); }
  #connectBtn { background: var(--accent); color: #1a1200; }
  #connectBtn:hover { filter: brightness(1.1); }
  .ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  .ghost:hover { color: var(--text); border-color: var(--text-dim); }
  .ghost.active { color: var(--accent); border-color: var(--accent-dim); }

  #statusWrap {
    margin-left: auto; display: flex; align-items: center; gap: 7px;
    font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-dim);
  }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
  #dot.connected { background: var(--ok); box-shadow: 0 0 6px var(--ok); animation: pulse 1.8s ease-in-out infinite; }
  #dot.error { background: var(--err); box-shadow: 0 0 6px var(--err); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  #statsText { font-variant-numeric: tabular-nums; min-width: 78px; }

  #toolsRow {
    display: flex; align-items: center; gap: 8px; padding: 8px 16px;
    background: var(--panel-2); border-bottom: 1px solid var(--border);
    flex-wrap: wrap; transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #toolsRow.hidden { opacity: 0; transform: translateY(-100%); pointer-events: none; }

  #stage {
    height: calc(100vh - 53px); display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, rgba(255,176,0,0.03), transparent 60%), var(--bg);
    padding: 16px; overflow: hidden; position: relative;
  }
  #stage.with-tools { height: calc(100vh - 91px); }

  #screen {
    display: block; background: #000; border: 1px solid var(--border); border-radius: 4px;
    outline: none; cursor: crosshair; max-width: 100%; max-height: 100%;
  }
  #stage:fullscreen { padding: 0; height: 100vh; }
  #stage:fullscreen #screen { border: none; border-radius: 0; }

  #placeholder {
    position: absolute; color: var(--text-dim); font-size: 12px; letter-spacing: 0.06em;
    text-align: center; pointer-events: none;
  }
  #placeholder .glyph { font-size: 22px; color: var(--accent-dim); margin-bottom: 8px; display: block; }

  #filePanel {
    position: fixed; top: 60px; right: -300px; width: 280px; max-height: 60vh;
    background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
    overflow-y: auto; transition: right 0.2s ease; z-index: 10; padding: 10px;
    font-size: 12px;
  }
  #filePanel.open { right: 16px; }
  #filePanel h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); }
  #dropZone {
    border: 1px dashed var(--border); border-radius: 4px; padding: 14px; text-align: center;
    color: var(--text-dim); font-size: 11px; margin-bottom: 10px; cursor: pointer;
  }
  #dropZone.drag { border-color: var(--accent); color: var(--accent); }
  .fileRow { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--border); gap: 6px; }
  .fileRow span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .fileRow button { padding: 3px 8px; font-size: 10px; }
  #transferProgress { font-size: 11px; color: var(--accent); margin-top: 6px; min-height: 14px; }
</style>
</head>
<body>

<div id="console">
  <div class="field">
    <label for="savedConns">Saved</label>
    <select id="savedConns"><option value="">— new —</option></select>
  </div>
  <div class="field">
    <label for="url">Relay</label>
    <input id="url" placeholder="ws://your-vm-ip:8080">
  </div>
  <div class="field">
    <label for="room">Room</label>
    <input id="room" placeholder="myroom">
  </div>
  <div class="field">
    <label for="token">Token</label>
    <input id="token" type="password" placeholder="••••••••">
  </div>
  <button id="connectBtn">Connect</button>
  <button id="saveConnBtn" class="ghost" title="Save this connection">Save</button>
  <button id="deleteConnBtn" class="ghost" title="Delete selected saved connection">Delete</button>

  <div id="statusWrap">
    <span id="dot"></span>
    <span id="statusText">disconnected</span>
    <span id="statsText"></span>
  </div>
</div>

<div id="toolsRow">
  <div class="field">
    <label for="monitorSelect">Display</label>
    <select id="monitorSelect"><option>Full Desktop</option></select>
  </div>
  <div class="field">
    <label for="qualitySelect">Quality</label>
    <select id="qualitySelect">
      <option value="low">Low (fast)</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
    </select>
  </div>
  <button id="viewOnlyBtn" class="ghost" title="Toggle view-only mode">Control: ON</button>
  <button id="lockBtn" class="ghost" title="Lock the remote PC">🔒 Lock PC</button>
  <button id="clipSendBtn" class="ghost" title="Send your clipboard to the PC">Clipboard →</button>
  <button id="clipGetBtn" class="ghost" title="Copy the PC's clipboard here">← Clipboard</button>
  <button id="filesBtn" class="ghost" title="File transfer">📁 Files</button>
  <button id="fullscreenBtn" class="ghost" title="Fullscreen">⛶ Fullscreen</button>
</div>

<div id="stage" class="with-tools">
  <div id="placeholder"><span class="glyph">▢</span>waiting for connection</div>
  <canvas id="screen" tabindex="0"></canvas>
</div>

<div id="filePanel">
  <h3>File Transfer</h3>
  <div id="dropZone">drop a file here<br>or click to choose</div>
  <input type="file" id="fileInput" style="display:none">
  <div id="transferProgress"></div>
  <div id="fileList"></div>
</div>

<script>
let ws = null;
let manualDisconnect = false;
let reconnectDelay = 1000;
let reconnectTimer = null;

const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');
const monitorSelect = document.getElementById('monitorSelect');
const qualitySelect = document.getElementById('qualitySelect');
const urlInput = document.getElementById('url');
const roomInput = document.getElementById('room');
const tokenInput = document.getElementById('token');
const savedConns = document.getElementById('savedConns');
const placeholder = document.getElementById('placeholder');
const consoleBar = document.getElementById('console');
const toolsRow = document.getElementById('toolsRow');
const filePanel = document.getElementById('filePanel');
const fileList = document.getElementById('fileList');
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const transferProgress = document.getElementById('transferProgress');
const statsText = document.getElementById('statsText');

canvas.style.display = 'none';
let viewOnly = false;
let pendingDownloads = {};

// ---------- Flicker-free frame rendering ----------
// Frames can arrive faster than the browser finishes decoding them, and JPEG
// decode is async, so decode completions aren't guaranteed to land in the
// order the frames were sent. Painting every decode as it finishes lets an
// older frame overwrite a newer one on screen — that's the flicker/tearing.
// Instead we track only the newest frame that has arrived (by sequence
// number from the host) and only ever paint it if it's still the newest by
// the time decoding finishes, dropping anything that went stale mid-decode.
let latestSeq = -1;
let latestData = null;
let renderedSeq = -1;
let decoding = false;
let framesRendered = 0, framesDropped = 0, lastStatsTime = performance.now();
let lastFrameTime = performance.now(), latencyMs = 0;

function onFrame(msg) {
  const now = performance.now();
  latencyMs = now - lastFrameTime;
  lastFrameTime = now;
  const seq = typeof msg.seq === 'number' ? msg.seq : (latestSeq + 1);
  if (seq < renderedSeq) return; // stale, drop
  latestSeq = seq;
  latestData = msg.data;
  if (!decoding) decodeNext();
}

function decodeNext() {
  if (latestSeq <= renderedSeq || latestData === null) { decoding = false; return; }
  decoding = true;
  const mySeq = latestSeq;
  const myData = latestData;
  const im = new Image();
  im.decoding = 'async';
  im.onload = () => {
    if (mySeq >= renderedSeq) {
      if (canvas.width !== im.width || canvas.height !== im.height) {
        canvas.width = im.width; canvas.height = im.height;
      }
      ctx.drawImage(im, 0, 0);
      renderedSeq = mySeq;
      framesRendered++;
      if (canvas.style.display === 'none') {
        canvas.style.display = 'block';
        placeholder.style.display = 'none';
      }
    } else {
      framesDropped++;
    }
    decoding = false;
    if (latestSeq > renderedSeq) decodeNext();
  };
  im.onerror = () => { decoding = false; if (latestSeq > renderedSeq) decodeNext(); };
  im.src = 'data:image/jpeg;base64,' + myData;
}

setInterval(() => {
  const now = performance.now();
  const secs = (now - lastStatsTime) / 1000;
  const fps = secs > 0 ? (framesRendered / secs).toFixed(1) : '0.0';
  if (statsText) {
    statsText.textContent = (ws && ws.readyState === WebSocket.OPEN)
      ? `${fps}fps · ${Math.round(latencyMs)}ms` : '';
  }
  framesRendered = 0; framesDropped = 0; lastStatsTime = now;
}, 1000);

// ---------- Saved connections ----------
const CONN_KEY = 'remoteDesktopConnections';

function loadConnections() {
  try { return JSON.parse(localStorage.getItem(CONN_KEY) || '[]'); }
  catch (e) { return []; }
}
function saveConnections(list) {
  localStorage.setItem(CONN_KEY, JSON.stringify(list));
}
function refreshSavedDropdown(selectName) {
  const list = loadConnections();
  savedConns.innerHTML = '<option value="">— new —</option>';
  list.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.name;
    opt.textContent = c.name;
    if (c.name === selectName) opt.selected = true;
    savedConns.appendChild(opt);
  });
}
savedConns.addEventListener('change', () => {
  const list = loadConnections();
  const c = list.find(x => x.name === savedConns.value);
  if (c) {
    urlInput.value = c.url; roomInput.value = c.room; tokenInput.value = c.token;
  }
});
document.getElementById('saveConnBtn').onclick = () => {
  const name = prompt('Name this connection:', savedConns.value || roomInput.value || 'my-pc');
  if (!name) return;
  const list = loadConnections().filter(c => c.name !== name);
  list.push({ name, url: urlInput.value.trim(), room: roomInput.value.trim(), token: tokenInput.value.trim() });
  saveConnections(list);
  refreshSavedDropdown(name);
};
document.getElementById('deleteConnBtn').onclick = () => {
  if (!savedConns.value) return;
  const list = loadConnections().filter(c => c.name !== savedConns.value);
  saveConnections(list);
  refreshSavedDropdown('');
};
refreshSavedDropdown('');

// ---------- Connect / status ----------
function setStatus(text, cls) {
  statusText.textContent = text;
  dot.className = cls || '';
}

document.getElementById('connectBtn').onclick = () => {
  manualDisconnect = false;
  reconnectDelay = 1000;
  doConnect();
};

function doConnect() {
  const base = urlInput.value.trim().replace(/\/$/, '');
  const room = roomInput.value.trim();
  const token = tokenInput.value.trim();
  const full = `${base}/?role=viewer&room=${encodeURIComponent(room)}&token=${encodeURIComponent(token)}`;
  connect(full);
}

function connect(url) {
  if (ws) ws.close();
  clearTimeout(reconnectTimer);
  setStatus('connecting');
  ws = new WebSocket(url);
  ws.onopen = () => {
    setStatus('connected', 'connected');
    canvas.focus();
    reconnectDelay = 1000;
    latestSeq = -1; latestData = null; renderedSeq = -1; decoding = false;
    send({ type: 'set_quality', preset: qualitySelect.value });
    send({ type: 'view_only', enabled: viewOnly });
  };
  ws.onclose = () => {
    setStatus('disconnected');
    canvas.style.display = 'none';
    placeholder.style.display = 'block';
    if (!manualDisconnect) {
      setStatus(`reconnecting in ${Math.round(reconnectDelay/1000)}s`);
      reconnectTimer = setTimeout(() => {
        doConnect();
        reconnectDelay = Math.min(reconnectDelay * 1.6, 15000);
      }, reconnectDelay);
    }
  };
  ws.onerror = () => setStatus('connection error', 'error');
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'frame') {
      onFrame(msg);
    } else if (msg.type === 'monitors') {
      populateMonitors(msg.list, msg.current);
    } else if (msg.type === 'clipboard') {
      navigator.clipboard.writeText(msg.text || '').catch(() => {});
      transferProgress.textContent = 'clipboard copied from PC';
      setTimeout(() => transferProgress.textContent = '', 2000);
    } else if (msg.type === 'file_list') {
      renderFileList(msg.files);
    } else if (msg.type === 'file_start_down') {
      pendingDownloads[msg.id] = { name: msg.name, chunks: {} };
    } else if (msg.type === 'file_chunk_down') {
      const d = pendingDownloads[msg.id];
      if (d) d.chunks[msg.seq] = msg.data;
    } else if (msg.type === 'file_end_down') {
      const d = pendingDownloads[msg.id];
      if (d) {
        const ordered = Object.keys(d.chunks).sort((a,b)=>a-b).map(k => d.chunks[k]).join('');
        const link = document.createElement('a');
        link.href = 'data:application/octet-stream;base64,' + ordered;
        link.download = d.name;
        link.click();
        delete pendingDownloads[msg.id];
      }
    }
  };
}

// ---------- Monitor / quality / view-only ----------
function populateMonitors(list, current) {
  const selectable = list.filter(m => m.index !== 0);
  monitorSelect.innerHTML = '';
  if (selectable.length === 0) {
    const opt = document.createElement('option'); opt.textContent = 'Full Desktop';
    monitorSelect.appendChild(opt); return;
  }
  selectable.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.index; opt.textContent = m.label;
    if (m.index === current) opt.selected = true;
    monitorSelect.appendChild(opt);
  });
}
monitorSelect.addEventListener('change', () => {
  const val = parseInt(monitorSelect.value, 10);
  if (!isNaN(val)) send({ type: 'select_monitor', index: val });
});
qualitySelect.addEventListener('change', () => {
  send({ type: 'set_quality', preset: qualitySelect.value });
});

const viewOnlyBtn = document.getElementById('viewOnlyBtn');
viewOnlyBtn.onclick = () => {
  viewOnly = !viewOnly;
  send({ type: 'view_only', enabled: viewOnly });
  viewOnlyBtn.textContent = viewOnly ? 'Control: OFF' : 'Control: ON';
  viewOnlyBtn.classList.toggle('active', viewOnly);
  canvas.style.cursor = viewOnly ? 'default' : 'crosshair';
};

document.getElementById('lockBtn').onclick = () => {
  if (confirm('Lock the remote PC now?')) send({ type: 'lock' });
};

document.getElementById('clipSendBtn').onclick = async () => {
  try {
    const text = await navigator.clipboard.readText();
    send({ type: 'clipboard_set', text });
    transferProgress.textContent = 'clipboard sent to PC';
    setTimeout(() => transferProgress.textContent = '', 2000);
  } catch (e) {
    alert('Could not read your clipboard (browser permission denied).');
  }
};
document.getElementById('clipGetBtn').onclick = () => send({ type: 'clipboard_get' });

document.getElementById('fullscreenBtn').onclick = () => {
  if (!document.fullscreenElement) stage.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
};

document.getElementById('filesBtn').onclick = () => {
  filePanel.classList.toggle('open');
  if (filePanel.classList.contains('open')) send({ type: 'file_list_request' });
};

// ---------- File transfer ----------
function renderFileList(files) {
  fileList.innerHTML = '';
  if (files.length === 0) {
    fileList.innerHTML = '<div style="color:var(--text-dim); font-size:11px;">no files yet</div>';
    return;
  }
  files.forEach(f => {
    const row = document.createElement('div');
    row.className = 'fileRow';
    const sizeKb = (f.size / 1024).toFixed(1);
    row.innerHTML = `<span title="${f.name}">${f.name} (${sizeKb}KB)</span>`;
    const dlBtn = document.createElement('button');
    dlBtn.className = 'ghost';
    dlBtn.textContent = '↓';
    dlBtn.onclick = () => {
      const id = 'dl_' + Date.now();
      send({ type: 'file_download_request', name: f.name, id });
    };
    row.appendChild(dlBtn);
    fileList.appendChild(row);
  });
}

dropZone.onclick = () => fileInput.click();
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('drag');
  if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) uploadFile(fileInput.files[0]);
});

function uploadFile(file) {
  const id = 'up_' + Date.now();
  const chunkSize = 150_000;
  const reader = new FileReader();
  reader.onload = () => {
    const bytes = new Uint8Array(reader.result);
    const totalChunks = Math.ceil(bytes.length / chunkSize);
    send({ type: 'file_start', id, name: file.name, size: bytes.length });
    let seq = 0;
    function sendNextChunk() {
      if (seq >= totalChunks) {
        send({ type: 'file_end', id });
        transferProgress.textContent = 'upload complete';
        setTimeout(() => transferProgress.textContent = '', 2000);
        return;
      }
      const start = seq * chunkSize;
      const chunk = bytes.slice(start, start + chunkSize);
      let binary = '';
      chunk.forEach(b => binary += String.fromCharCode(b));
      send({ type: 'file_chunk', id, seq, data: btoa(binary) });
      transferProgress.textContent = `uploading... ${Math.round((seq/totalChunks)*100)}%`;
      seq++;
      setTimeout(sendNextChunk, 15); // small delay so relay/socket isn't flooded
    }
    sendNextChunk();
  };
  reader.readAsArrayBuffer(file);
}

// ---------- Auto-hide toolbar in fullscreen ----------
let hideTimer = null;
document.addEventListener('fullscreenchange', () => {
  if (document.fullscreenElement) {
    stage.addEventListener('mousemove', showBarsTemporarily);
  } else {
    consoleBar.classList.remove('hidden');
    toolsRow.classList.remove('hidden');
    stage.removeEventListener('mousemove', showBarsTemporarily);
  }
});
function showBarsTemporarily(e) {
  if (e.clientY < 60) {
    consoleBar.classList.remove('hidden');
    toolsRow.classList.remove('hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      consoleBar.classList.add('hidden');
      toolsRow.classList.add('hidden');
    }, 2000);
  }
}

// ---------- Input forwarding ----------
function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}
function scaledCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const x = Math.round((e.clientX - rect.left) * (canvas.width / rect.width));
  const y = Math.round((e.clientY - rect.top) * (canvas.height / rect.height));
  return { x, y };
}
canvas.addEventListener('mousemove', (e) => { if (!viewOnly) send({ type: 'mousemove', ...scaledCoords(e) }); });
canvas.addEventListener('mousedown', (e) => { if (!viewOnly) { send({ type: 'mousedown', ...scaledCoords(e), button: e.button }); canvas.focus(); } });
canvas.addEventListener('mouseup', (e) => { if (!viewOnly) send({ type: 'mouseup', button: e.button }); });
canvas.addEventListener('wheel', (e) => { if (!viewOnly) send({ type: 'scroll', dy: e.deltaY }); e.preventDefault(); }, { passive: false });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('keydown', (e) => { if (!viewOnly) send({ type: 'keydown', key: e.key }); e.preventDefault(); });
canvas.addEventListener('keyup', (e) => { if (!viewOnly) send({ type: 'keyup', key: e.key }); e.preventDefault(); });
</script>
</body>
</html>
